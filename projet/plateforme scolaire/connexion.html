<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Plateforme scolaire</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="accueil-scolaire">

        <div class="contenu">

            <h1>🔐 Connexion</h1>

            <p>
                Connectez-vous à votre compte.
            </p>

            <form id="formulaireConnexion">

                <label>Email :</label>
                <input 
                    type="email" 
                    id="email"
                    placeholder="Votre email"
                >

                <label>Mot de passe :</label>
                <input 
                    type="password" 
                    id="motDePasse"
                    placeholder="Votre mot de passe"
                >

                <button type="submit">
                    Se connecter
                </button>

            </form>

            <p id="message"></p>

            <a href="inscription.html" class="retour-portfolio">
                ← Créer un compte
            </a>

        </div>

    </main>

    <script src="connexion.js"></script>

</body>

</html>
